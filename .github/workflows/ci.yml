name: Logic Fit CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: logic-fit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and safe QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Baseline runner safety tests
        run: npm run test:performance-baseline

      - name: Static project QA gate
        run: npm run qa:gate

      - name: Production build
        run: npm run build

<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/main.css?v=64"><link rel="icon" type="image/svg+xml" href="/assets/gym-brand.svg?v=2"><title>غير مصرح | Logic Fit</title></head>
<body class="platform-forbidden-page"><main class="platform-forbidden-card"><span class="platform-brand-mark">L</span><span class="eyebrow">PLATFORM ADMIN ONLY</span><h1>هذه المساحة مخصصة لمدير المنصة</h1><p>حسابات Owner وAssistant تستخدم تطبيق الجيم من المسار الرئيسي فقط.</p><div class="platform-forbidden-actions"><a class="platform-btn ghost" href="/">العودة إلى تطبيق الجيم</a><button class="platform-btn primary" id="platformAdminSwitchAccount" type="button">تسجيل الخروج والدخول كمدير المنصة</button></div></main><script>
    document.getElementById('platformAdminSwitchAccount')?.addEventListener('click', async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = 'جارٍ تجهيز تسجيل الدخول...';
        try {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
        } finally {
            window.location.assign('/platform-admin');
        }
    });
</script></body>
</html>

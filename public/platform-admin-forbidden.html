<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/main.css?v=6627a03e19ec8e22"><link rel="icon" type="image/svg+xml" href="/assets/logic-fit-app-icon.svg?v=2"><title data-i18n="platformAdminForbidden.pageTitle">غير مصرح | Logic Fit</title></head>
<body class="platform-forbidden-page"><main class="platform-forbidden-card"><span class="platform-brand-mark"><img src="/assets/logic-fit-app-icon.svg?v=2" alt=""></span><div class="platform-forbidden-language" data-i18n-switcher></div><span class="eyebrow" data-i18n="platformAdminForbidden.eyebrow">لإدارة المنصة فقط</span><h1 data-i18n="platformAdminForbidden.title">هذه المساحة مخصصة لمدير المنصة</h1><p data-i18n="platformAdminForbidden.description">حسابات مالك الجيم والمساعد تستخدم تطبيق الجيم من المسار الرئيسي.</p><div class="platform-forbidden-actions"><a class="platform-btn ghost" href="/" data-i18n="platformAdminForbidden.returnToGym">العودة إلى تطبيق الجيم</a><button class="platform-btn primary" id="platformAdminSwitchAccount" type="button" data-i18n="platformAdminForbidden.switchAccount">تسجيل الخروج والدخول كمدير للمنصة</button></div></main><script defer src="/js/core/i18n.js?v=1aa7584f55ced95d"></script><script>
    document.getElementById('platformAdminSwitchAccount')?.addEventListener('click', async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = window.TopGymI18n?.t('platformAdminForbidden.switchAccount.loading') || button.textContent;
        try {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
        } finally {
            window.location.assign('/platform-admin');
        }
    });
</script></body>
</html>

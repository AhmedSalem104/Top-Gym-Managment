<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F5F7FB">
    <meta name="auth-routing-version" content="forced-password-v3">
    <script>
        (function () {
            try {
                var savedTheme = window.localStorage.getItem('topgym-theme');
                document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'light';
            } catch (error) {
                document.documentElement.dataset.theme = 'light';
            }
        }());
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='sty'+'lesheet'">
    <link rel="icon" type="image/svg+xml" href="/assets/gym-brand.svg?v=2" sizes="any">
    <link rel="shortcut icon" type="image/svg+xml" href="/assets/gym-brand.svg?v=2">
    <link rel="stylesheet" href="/css/login-entry.css?v=52487abf37ab">
    <title>Logic Fit | Gym Management</title>
</head>
<body class="auth-pending font-sans bg-slate-100 text-slate-900 gym-page-bg" data-branding-entry="saas" data-auth-entry="login">
    <section class="auth-screen" id="authScreen" data-auth-stage="login" aria-label="بوابة الجيم">
        <div class="auth-shell">
            <div class="auth-card" id="authLoginCard" hidden>
                            <button class="auth-theme-toggle theme-toggle-button" type="button" data-theme-toggle aria-pressed="false" title="تفعيل الوضع الداكن">
                                <svg class="ui-icon theme-toggle-icon theme-toggle-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
                                <svg class="ui-icon theme-toggle-icon theme-toggle-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                                <span data-theme-toggle-label>الوضع الداكن</span>
                            </button>
                            <section class="auth-form-panel" aria-label="نموذج الدخول">
                                <div class="auth-branding-lockup" data-brand-logo-shell>
                                    <div class="auth-branding-mark"><span class="auth-branding-dumbbell" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17v14M12 12v24M17 20v8M31 20v8M36 12v24M41 17v14M17 24h14"/></svg></span><img data-brand-logo="compactLogo" alt="" hidden><span data-brand-logo-fallback>L</span></div>
                                    <div class="auth-branding-copy"><strong data-brand-text="brandName">Logic Fit</strong><small data-brand-text="description">منصة الإدارة الذكية للجيم واللياقة.</small></div>
                                </div>
                                <form class="auth-form" id="loginForm" novalidate>
                                    <div class="auth-form-heading"><h2>مرحبًا بعودتك</h2><p>سجل الدخول إلى حسابك لمتابعة عملك</p></div>
                                    <div class="auth-field"><label for="loginEmail">البريد الإلكتروني</label><div class="auth-input-wrap"><svg class="auth-input-icon ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="loginEmail" dir="ltr" type="email" autocomplete="username" inputmode="email" maxlength="254" required placeholder="أدخل البريد الإلكتروني"></div></div>
                                    <div class="auth-field"><label for="loginPassword">كلمة المرور</label><div class="auth-password-wrap"><svg class="auth-input-icon ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="loginPassword" dir="ltr" type="password" autocomplete="current-password" maxlength="128" required placeholder="أدخل كلمة المرور"><button class="auth-password-toggle" id="loginPasswordToggle" type="button" aria-label="إظهار كلمة المرور"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></div>
                                    <div class="auth-account-row"><label class="auth-remember" for="loginRememberMe"><input id="loginRememberMe" type="checkbox"><span>تذكرني</span></label><span class="auth-forgot-note" aria-hidden="true">نسيت كلمة المرور؟</span></div>
                                    <p class="auth-message" id="loginMessage" role="alert" hidden></p>
                                    <p class="auth-setup-note" id="loginSetupNote" hidden>لم يتم إعداد حساب المالك بعد. أضف AUTH_OWNER_EMAIL وAUTH_OWNER_PASSWORD في إعدادات الخادم ثم أعد المحاولة.</p>
                                    <button class="btn btn-primary auth-submit" id="loginSubmit" type="submit" data-feedback-ignore data-loading-text="جاري تسجيل الدخول..."><span class="auth-spinner" aria-hidden="true"></span><span class="auth-submit-label">تسجيل الدخول</span><svg class="auth-submit-arrow ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></button>
                                </form>
                                <p class="auth-footer" dir="rtl" data-brand-text="copyrightText">© Logic Fit — Smart management, better performance</p>
                            </section>
                        </div>
        </div>
    </section>
    <script defer src="/js/theme.js?v=1"></script>
    <script defer src="/js/branding.js?v=5"></script>
    <script defer src="/js/core/permissions.js?v=6"></script>
    <script defer src="/js/auth-ui.js?v=21"></script>
</body>
</html>
